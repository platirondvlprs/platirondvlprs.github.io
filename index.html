<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Travel in Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Glossy black background with depth */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.03) 0%, transparent 50%),
                linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
        }

        /* Animated silky wave */
        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0;
            left: -50%;
        }

        .wave::before,
        .wave::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                135deg,
                transparent 0%,
                rgba(255, 215, 0, 0.15) 25%,
                rgba(0, 191, 255, 0.15) 50%,
                rgba(255, 107, 107, 0.15) 75%,
                transparent 100%
            );
            animation: wave 20s ease-in-out infinite;
            opacity: 0.6;
        }

        .wave::before {
            border-radius: 45%;
            animation-delay: -5s;
        }

        .wave::after {
            border-radius: 40%;
            opacity: 0.4;
        }

        @keyframes wave {
            0%, 100% {
                transform: translate(-50%, -75%) rotate(0deg);
            }
            50% {
                transform: translate(-30%, -65%) rotate(180deg);
            }
        }

        /* Glossy overlay effect */
        .glossy-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.05) 0%,
                transparent 100%
            );
            pointer-events: none;
        }

        .container {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 100px rgba(255, 215, 0, 0.1);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700 0%, #00BFFF 50%, #FF6B6B 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            color: white;
            box-shadow: 
                0 10px 40px rgba(255, 215, 0, 0.3),
                0 0 60px rgba(0, 191, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            animation: pulse 3s ease-in-out infinite;
            position: relative;
        }

        .profile-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 10px 40px rgba(255, 215, 0, 0.3),
                    0 0 60px rgba(0, 191, 255, 0.2);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 
                    0 15px 50px rgba(255, 215, 0, 0.5),
                    0 0 80px rgba(0, 191, 255, 0.3);
            }
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #FFD700, #00BFFF, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .tagline {
            color: #c0c0c0;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .location {
            color: #888;
            font-size: 14px;
            font-weight: 300;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-link {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 15px;
            text-decoration: none;
            color: #e0e0e0;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .social-link.instagram:hover {
            background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
            border-color: #ee2a7b;
            box-shadow: 0 8px 30px rgba(238, 42, 123, 0.4);
        }

        .social-link.facebook:hover {
            background: linear-gradient(135deg, #1877F2, #0a4ba6);
            border-color: #1877F2;
            box-shadow: 0 8px 30px rgba(24, 119, 242, 0.4);
        }

        .social-link.snapchat:hover {
            background: linear-gradient(135deg, #FFFC00, #FDD835);
            border-color: #FFFC00;
            color: #000;
            box-shadow: 0 8px 30px rgba(255, 252, 0, 0.4);
        }

        .social-link.tiktok:hover {
            background: linear-gradient(135deg, #000000, #333333);
            border-color: #00f2ea;
            box-shadow: 0 8px 30px rgba(0, 242, 234, 0.4);
        }

        .social-link.twitter:hover {
            background: linear-gradient(135deg, #1DA1F2, #0c85d0);
            border-color: #1DA1F2;
            box-shadow: 0 8px 30px rgba(29, 161, 242, 0.4);
        }

        .social-link.linkedin:hover {
            background: linear-gradient(135deg, #0A66C2, #004182);
            border-color: #0A66C2;
            box-shadow: 0 8px 30px rgba(10, 102, 194, 0.4);
        }

        .icon {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
        }

        .link-text {
            flex-grow: 1;
            letter-spacing: 0.5px;
        }

        .arrow {
            font-size: 20px;
            transition: transform 0.3s ease;
            opacity: 0.7;
        }

        .social-link:hover .arrow {
            transform: translateX(5px);
            opacity: 1;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            font-weight: 300;
        }

        /* Floating particles for luxury effect */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            animation: float-particle 15s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .particle:nth-child(2) { 
            left: 20%; 
            animation-delay: 2s; 
            background: rgba(0, 191, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.8);
        }
        .particle:nth-child(3) { 
            left: 40%; 
            animation-delay: 4s; 
            background: rgba(255, 107, 107, 0.6);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.8);
        }
        .particle:nth-child(4) { 
            left: 60%; 
            animation-delay: 6s; 
        }
        .particle:nth-child(5) { 
            left: 80%; 
            animation-delay: 8s; 
            background: rgba(0, 191, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.8);
        }

        @keyframes float-particle {
            0%, 100% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .social-link {
                padding: 15px 20px;
            }
        }
    </style>
</head>
